name: contextdb-quality

on:
  pull_request:
    paths:
      - "mcp-server/**"
      - ".github/workflows/contextdb-quality.yml"
  push:
    branches:
      - main
    paths:
      - "mcp-server/**"
      - ".github/workflows/contextdb-quality.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install mcp-server deps
        working-directory: mcp-server
        run: npm ci

      - name: Install Playwright browsers
        working-directory: mcp-server
        run: npx playwright install --with-deps chromium

      - name: Typecheck + ContextDB tests
        working-directory: mcp-server
        run: |
          npm run typecheck
          npm run test:contextdb

      - name: ContextDB refs benchmark
        working-directory: mcp-server
        run: npm run bench:contextdb:refs:ci

      - name: ContextDB refs benchmark gate
        working-directory: mcp-server
        run: >
          npm run bench:contextdb:refs:gate --
          --refs-only-p95-max 900
          --refs-query-p95-max 900
          --refs-only-avg-max 450
          --refs-query-avg-max 450

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contextdb-refs-bench
          path: mcp-server/test-results/contextdb-refs-bench.json
          if-no-files-found: ignore
